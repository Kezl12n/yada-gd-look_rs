[package]
name = "yada-gd-look_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
memmap2 = "0.9.12"
pinyin-converter = "0.1.0"
yada = "0.7.0"
zhconv = "0.4.2"


rusto-rs = { version = "0.4.1", optional = true }
anyhow = "1.0.105"


[features]
default = []
ocr = ["dep:rusto-rs"]


[profile.release]
lto = true
codegen-units = 1
strip = true


