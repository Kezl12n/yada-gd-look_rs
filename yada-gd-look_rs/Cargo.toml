[package]
name = "yada-gd-look_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
memmap2 = "0.9.12"
pinyin-converter = "0.1.0"
yada = "0.7.0"
zhconv = "0.4.2"


ocr-rs = { version = "2.4.1", optional = true }
image = { version = "0.25.10", optional = true }
libwayshot = { version = "0.10.0", optional = true }
anyhow = { version = "1.0.105", optional = true }

[features]
default = []
ocr = ["dep:ocr-rs", "dep:image", "dep:libwayshot", "dep:anyhow"]

[profile.release]
lto = true
codegen-units = 1
strip = true
